:root{

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"BVP",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font-family:inherit}
.wrap{max-width:460px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* Thanh trên: logo + ngôn ngữ/giao diện */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.brand img{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px 5px;box-sizing:content-box;border:1px solid var(--line)}
.brand span{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);line-height:1.3}
.tools{display:flex;gap:6px}
.tbtn{height:32px;min-width:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12px;font-weight:600;cursor:pointer}

/* Khối nhận diện */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:18px;padding:22px 20px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.id{display:flex;gap:16px;align-items:center}
.avatar{flex:0 0 84px;width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);background:#13315C;display:grid;place-items:center;font-weight:700;font-size:28px;color:#fff}
.id h1{font-size:22px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.role{margin-top:4px;font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#8FD3EF}
.company{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);font-size:13.5px;font-weight:600;color:#fff}
.tagline{margin-top:4px;font-size:13px;color:rgba(255,255,255,.72)}

/* Liên hệ */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px}
h2{font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.contact{padding:4px 18px}
.crow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);color:var(--text);text-decoration:none}
.crow:first-child{border-top:0}
.cic{flex:0 0 38px;height:38px;border-radius:10px;background:var(--ice-soft);color:var(--ice);display:grid;place-items:center}
.cic svg{width:19px;height:19px}
.crow small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.crow b{display:block;font-size:15px;font-weight:600;line-height:1.35;word-break:break-word}
.crow .go{margin-left:auto;color:var(--muted);font-size:18px}

/* Số liệu */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--ice-soft);border-radius:12px;padding:12px 10px}
.stat b{display:block;font-size:24px;font-weight:700;line-height:1;color:var(--text)}
.stat span{display:block;margin-top:6px;font-size:11.5px;line-height:1.3;color:var(--muted)}
.proj{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.proj:first-of-type{border-top:0;padding-top:2px}
.proj b{display:block;font-size:14.5px;font-weight:600}
.proj small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.proj em{font-style:normal;font-size:20px;font-weight:700;color:var(--ice);flex:0 0 auto}
.more{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500}
.steps{display:flex;flex-wrap:wrap;gap:4px 0;font-size:12.5px;font-weight:600;color:var(--ice);margin-bottom:12px}
.steps span:not(:last-child)::after{content:"›";margin:0 7px;color:var(--muted)}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.plist li{list-style:none;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.plist li:nth-child(-n+2){border-top:0;padding-top:0}

.office{padding:10px 0;border-top:1px solid var(--line);display:block;color:var(--text);text-decoration:none}
.office:first-of-type{border-top:0;padding-top:0}
.office small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.office span{font-size:14px;font-weight:500}
footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:20px;line-height:1.6}

/* Thanh hành động cố định */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:428px;margin:0 auto;display:grid;grid-template-columns:1fr 52px 52px;gap:8px}
.save{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:12px;background:var(--cta);color:var(--cta-text);font-weight:600;font-size:15px;text-decoration:none;border:0}
.ibtn{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer}
.ibtn svg,.save svg{width:20px;height:20px}

/* Hộp QR */
.modal{position:fixed;inset:0;background:rgba(4,12,24,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.box{background:#fff;color:#0F1B2D;border-radius:18px;padding:16px;text-align:center;width:100%;max-width:340px;max-height:100%;overflow:auto}
#qrImg{width:100%;max-width:300px;aspect-ratio:4/5;margin:0 auto 6px;display:block;border-radius:10px;border:1px solid #E3E8EF;background:#fff;-webkit-touch-callout:default}
.hint{font-size:12px;color:#5B6B80;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost{height:46px;border-radius:12px;border:1px solid #E3E8EF;background:#fff;color:#0F1B2D;font-weight:600;font-size:14px;cursor:pointer}
.primary{background:#0B2545;color:#fff;border-color:#0B2545}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#0B2545;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:11}
.toast.on{opacity:1}
</style>
</head>

  $("tagline").textContent = L.tagline;
  $("langBtn").textContent = t.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  $("logo").src = CONFIG.logo; $("brand").href = CONFIG.website;
  $("avatarBox").innerHTML = CONFIG.photo
    ? `<img class="avatar" src="${CONFIG.photo}" alt="${nm}">`
    : `<div class="avatar">${CONFIG.initials}</div>`;

  /* Thứ tự cố định theo SOP: Gọi, Zalo, Email, Website (+ Lưu danh bạ ở thanh dưới) */
  const rows = [
    ["call", t.call, CONFIG.phoneText, `tel:${CONFIG.phone}`, false],
    ["zalo", t.zalo, CONFIG.phoneText, `https://zalo.me/${CONFIG.zalo}`, true],
    ["email", t.email, CONFIG.email, `mailto:${CONFIG.email}`, false],
    ["web", t.web, CONFIG.website.replace(/^https?:\/\//, ""), CONFIG.website, true]
  ];
  $("contact").innerHTML = rows.map(([k,l,v,h,nw]) =>
    `<a class="crow" href="${h}" ${nw?'target="_blank" rel="noopener"':''}><span class="cic">${svg(IC[k])}</span><span><small>${l}</small><b>${v}</b></span><span class="go">›</span></a>`).join("");

  $("stats").innerHTML = L.stats.map(([v,l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  $("projects").innerHTML = L.projects.map(p => `<div class="proj"><div><b>${p.t}</b><small>${p.d}</small></div><em>${p.n}</em></div>`).join("");
  $("pdf").href = CONFIG.profilePdf;
  $("chips").innerHTML = L.expertise.map(x => `<span class="chip">${x}</span>`).join("");
  $("services").innerHTML = L.services.map(x => `<span>${x}</span>`).join("");
  $("products").innerHTML = L.products.map(x => `<li>${x}</li>`).join("");

  const q = a => "https://maps.google.com/?q=" + encodeURIComponent(a);
  $("offices").innerHTML = [[t.hq, CONFIG.address, CONFIG.mapsUrl],[t.factory, CONFIG.factory, null]]
    .filter(o => o[1])
    .map(([k,a,u]) => `<a class="office" href="${u||q(a)}" target="_blank" rel="noopener"><small>${k}</small><span>${a}</span></a>`).join("");

  $("foot").innerHTML = `${CONFIG.en.company}<br>MST / Tax ID ${CONFIG.taxId}`;
}

function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1800); }

$("langBtn").onclick = () => { lang = lang==="vi"?"en":"vi"; try{localStorage.setItem("lang",lang)}catch(e){} render(); };
$("themeBtn").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

/* ---------- Ảnh QR 1080 × 1350 px ---------- */
let qrBlob = null, qrUrl = null, qrLang = null;
const FONT = '"BVP", system-ui, sans-serif';
const loadImg = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
/* Chữ có giãn ký tự, tự thu nhỏ để vừa khung, căn giữa */
function drawText(x, text, cx, y, o){
  let size = o.size, sp = o.track || 0, w;
  const measure = () => { x.font = `${o.weight} ${size}px ${FONT}`; w = [...text].reduce((s,ch) => s + x.measureText(ch).width, 0) + sp * ([...text].length - 1); };
  measure();
  while(w > o.max && size > 18){ size -= 1; sp = (o.track || 0) * size / o.size; measure(); }
  x.fillStyle = o.color; x.textAlign = "left";
  let px = cx - w / 2;
  for(const ch of text){ x.fillText(ch, px, y); px += x.measureText(ch).width + sp; }
}
async function buildQrCard(){
  if(qrBlob && qrLang === lang) return;
  const L = CONFIG[lang], t = T[lang], W = 1080, H = 1350, nm = L.name || CONFIG.name;
  /* Nạp đủ font và bộ dấu tiếng Việt trước khi vẽ – tránh rơi về font hệ thống */
  const sample = nm + L.role.toUpperCase() + L.company + t.qrCaption;
  try{ await Promise.all([400,600,700].map(w => document.fonts.load(`${w} 40px "BVP"`, sample))); }catch(e){}
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.textBaseline = "alphabetic";
  x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#0B2545"; x.fillRect(0, 0, W, 14); x.fillRect(0, H - 14, W, 14);

  const logo = await loadImg(CONFIG.logo);
  if(logo){ const h = 120, w = logo.width * h / logo.height; x.drawImage(logo, (W - w) / 2, 64, w, h); }
  drawText(x, nm, W/2, 286, {size:66, weight:700, color:"#0F1B2D", max:W-160, track:-0.5});
  drawText(x, L.role.toUpperCase(), W/2, 340, {size:28, weight:600, color:"#1597C9", max:W-160, track:5});
  x.fillStyle = "#D5DCE5"; x.fillRect(W/2 - 50, 372, 100, 3);
  drawText(x, L.company, W/2, 422, {size:29, weight:400, color:"#5B6B80", max:W-150, track:0});

  const qs = 600, qy = 480, qx = (W - qs) / 2;
  x.strokeStyle = "#E3E8EF"; x.lineWidth = 3;
  x.beginPath(); x.roundRect ? x.roundRect(qx - 32, qy - 32, qs + 64, qs + 64, 28) : x.rect(qx - 32, qy - 32, qs + 64, qs + 64); x.stroke();
  const qc = document.createElement("canvas");
  if(window.QRious) new QRious({ element: qc, value: CONFIG.cardUrl, size: qs, level: "H", foreground: "#0B2545", background: "#FFFFFF", padding: 0 });
  x.drawImage(qc, qx, qy, qs, qs);
  /* Chân dung giữa mã: đường kính 22% cạnh QR, mức sửa lỗi H (30%) */
  const av = CONFIG.photo ? await loadImg(CONFIG.photo) : null;
  if(av){
    const d = Math.round(qs * 0.22), cx = W / 2, cy = qy + qs / 2, r = d / 2;
    x.fillStyle = "#FFFFFF"; x.beginPath(); x.arc(cx, cy, r + 12, 0, Math.PI * 2); x.fill();
    x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.clip();
    const sq = Math.min(av.width, av.height);
    x.drawImage(av, (av.width - sq) / 2, (av.height - sq) / 2, sq, sq, cx - r, cy - r, d, d);
    x.restore();
    x.strokeStyle = "#0B2545"; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, r + 2, 0, Math.PI * 2); x.stroke();
  }
  drawText(x, t.qrCaption, W/2, qy + qs + 120, {size:32, weight:400, color:"#5B6B80", max:W-160, track:0});

  qrBlob = await new Promise(ok => c.toBlob(ok, "image/png"));
  if(qrUrl) URL.revokeObjectURL(qrUrl);
  qrUrl = URL.createObjectURL(qrBlob); qrLang = lang;
}
const qrFileName = () => "QR-Duong-Quoc-De.png";
function downloadQr(){
  const a = document.createElement("a"); a.href = qrUrl; a.download = qrFileName();
  document.body.appendChild(a); a.click(); a.remove();
}
async function openQr(){ $("modal").classList.add("on"); await buildQrCard(); $("qrImg").src = qrUrl; }
$("qrBtn").onclick = openQr;
$("shareQr").onclick = async () => {
  await buildQrCard();
  const file = new File([qrBlob], qrFileName(), { type: "image/png" });
  try{
    if(navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: CONFIG[lang].name || CONFIG.name });
    else downloadQr();
  }catch(e){ if(e && e.name !== "AbortError") downloadQr(); }
};
$("saveQr").onclick = async () => { await buildQrCard(); downloadQr(); };
$("closeQr").onclick = () => $("modal").classList.remove("on");
$("modal").onclick = e => { if(e.target.id==="modal") $("modal").classList.remove("on"); };
$("shareBtn").onclick = async () => {
  const L = CONFIG[lang];
  const data = {title: L.name || CONFIG.name, text: L.role + " – " + L.company, url: CONFIG.cardUrl};
  try{
    if(navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(data.url); toast(T[lang].copied); }
  }catch(e){}
};

render();
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let qrShown = false;
try{ qrShown = !!sessionStorage.getItem("qrShown"); sessionStorage.setItem("qrShown", "1"); }catch(e){}
if(/[?&]qr=1/.test(location.search) || (standalone && !qrShown)) openQr();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
